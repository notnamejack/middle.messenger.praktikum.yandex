<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{metaDescription}}" />
    <title>{{appTitle}}</title>
    <link rel="stylesheet" href="/src/style.scss" />
  </head>
  <body>
    <main class="page" id="page">
      <div class="container-message">
        <div class="chats">
          <div class="profile">
            <a href="/src/pages/profile.html" class="link">Профиль</a>
          </div>
          <div class="find">
            <input id="message" name="message" class="find-chat" placeholder="Поиск"/>
          </div>
          <ul class="list">
            {{#each chats}}
              {{> chat-item}}
            {{else}}
              <li class="item empty">
                <p class="desc">У вас нет чатов</p>
              </li>
            {{/each}}
          </ul>
        </div>
        <!-- message -->
        <div class="chat">
          <p class="desc">Выберите чат чтобы отправить сообщение</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
